<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish / Ro'yxatdan o'tish - SBS IELTS Examiner</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <link rel="icon" type="image/png" href="../assets/images/logophoto.png" />
  </head>
  <body class="auth-body">
    <!-- LOGIN CONTAINER -->
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="assets/images/logophoto.png" alt="SBS IELTS Logo" />
          <h2>SBS IELTS Examiner</h2>
          <p>Tizimga kirish uchun Gmail va parolingizni kiriting</p>
        </div>

        <!-- Login Forma -->
        <form action="dashboard.html" method="GET" class="auth-form">
          <div class="form-group">
            <label for="email">Gmail (Elektron pochta)</label>
            <input
              type="email"
              id="email"
              placeholder="example@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Parol</label>
            <input
              type="password"
              id="password"
              placeholder="********"
              required
            />
          </div>

          <button
            type="submit"
            class="btn-primary"
            style="width: 100%; padding: 0.75rem; margin-top: 1rem"
          >
            Kirish
          </button>
        </form>

        <div class="auth-footer">
          <p>
            Hisobingiz yo'qmi?
            <a href="#" onclick="toggleAuthMode(event)">Ro'yxatdan o'tish</a>
          </p>
          <p style="margin-top: 10px">
            <a href="index.html" style="color: #6b7280; text-decoration: none"
              >← Bosh sahifaga qaytish</a
            >
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
